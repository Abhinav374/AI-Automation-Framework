[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vwo-test-creator-mcp"
version = "0.1.0"
description = "A local MCP server for searching, planning, authoring, and exporting VWO test cases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
vwo-test-creator-mcp = "tc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tc_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/vwo_5000_test_cases.csv" = "tc_mcp/data/vwo_5000_test_cases.csv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
