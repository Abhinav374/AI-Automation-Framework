<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#07151d"/>
      <stop offset="50%" stop-color="#0d2330"/>
      <stop offset="100%" stop-color="#122d3c"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" x2="1">
      <stop offset="0%" stop-color="#39d0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#67f1b4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" x2="1">
      <stop offset="0%" stop-color="#31d0ff"/>
      <stop offset="100%" stop-color="#8af0c0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18">
