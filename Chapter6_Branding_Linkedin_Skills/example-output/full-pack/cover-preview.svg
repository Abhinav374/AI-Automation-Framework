    <text x="180" y="12" fill="#dffaff" font-size="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">2</text>

    <circle cx="360" cy="0" r="48" fill="#0d2d39" stroke="#39d0ff" stroke-width="3"/>
