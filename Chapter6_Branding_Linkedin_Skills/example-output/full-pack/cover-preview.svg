  <rect x="120" y="120" width="520" height="660" rx="24" fill="#0b1d28" stroke="#2fe0ff" stroke-opacity="0.8"/>
  <text x="170" y="220" fill="#dffaff" font-size="30" font-family="Segoe UI, Arial, sans-serif" letter-spacing="4">7-STEP FORMULA</text>
  <text x="170" y="360" fill="#ffffff" font-size="82" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Manual QA</text>
  <text x="170" y="448" fill="#ffffff" font-size="82" font-family="Segoe UI, Arial, sans-serif" font-weight="700">to Automation</text>
  <text x="170" y="560" fill="#a9d5df" font-size="28" font-family="Segoe UI, Arial, sans-serif">Build repetition, projects, and proof</text>

  <g transform="translate(760 200)">
